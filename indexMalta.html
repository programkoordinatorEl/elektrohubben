function makePopup(place){

    let index = 0;

    const container = L.DomUtil.create('div');
    container.style.textAlign = "center";

    const title = L.DomUtil.create('h3', '', container);

    const img = L.DomUtil.create('img', '', container);
    img.style.width = "250px";
    img.style.borderRadius = "10px";

    const text = L.DomUtil.create('p', '', container);

    const link = L.DomUtil.create('a', '', container);
    link.href = place.url;
    link.target = "_blank";
    link.innerHTML = "🔗 besøk nettside";

    // 🔥 viktig for layout
    link.style.display = "block";
    link.style.marginTop = "10px";

    const btnWrap = L.DomUtil.create('div', '', container);
    btnWrap.style.marginTop = "8px";

    const btnPrev = L.DomUtil.create('button', '', btnWrap);
    btnPrev.innerHTML = "⬅️ Forrige";

    const btnNext = L.DomUtil.create('button', '', btnWrap);
    btnNext.innerHTML = "➡️ Neste";

    function render(){
        title.innerHTML = place.name;
        img.src = place.images[index];
        text.innerHTML = place.text;
    }

    btnNext.addEventListener("click", function(e){
        L.DomEvent.stopPropagation(e);
        index = (index + 1) % place.images.length;
        render();
    });

    btnPrev.addEventListener("click", function(e){
        L.DomEvent.stopPropagation(e);
        index = (index - 1 + place.images.length) % place.images.length;
        render();
    });

    render();

    return container;
}
